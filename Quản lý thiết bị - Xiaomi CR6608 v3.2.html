<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CR6608 Device Manager v3.2</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    /* ==========================================================================
       Material Design 3 (Material You) - Zero-Repaint High Performance Tokens
       ========================================================================== */
    :root {
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 28px; --r-full: 9999px;
      --ease: cubic-bezier(0.2, 0, 0, 1);

      --primary: #0061A4; --on-primary: #FFFFFF;
      --primary-container: #D1E4FF; --on-primary-container: #001D36;
      --secondary-container: #D7E3F7; --on-secondary-container: #101C2B;
      --tertiary-container: #F2DAFF; --on-tertiary-container: #251431;
      --error: #BA1A1A; --on-error: #FFFFFF;
      --error-container: #FFDAD6; --on-error-container: #410002;
      --bg: #F8F9FF; --on-bg: #191C20;
      --surface-variant: #DFE2EB; --on-surface-variant: #43474E;
      --outline: #73777F; --outline-variant: #C3C7D0;
      --surf-lowest: #FFFFFF; --surf-low: #F2F3FA; --surf: #ECEEF4; --surf-high: #E6E8EE; --surf-highest: #E0E2E8;
      --success: #198754;
      --warning-container: #FFDEA6; --on-warning-container: #271900;
    }

    [data-theme="dark"] {
      --primary: #9ECAFF; --on-primary: #003258;
      --primary-container: #00497D; --on-primary-container: #D1E4FF;
      --secondary-container: #3B4858; --on-secondary-container: #D7E3F7;
      --tertiary-container: #523F5F; --on-tertiary-container: #F2DAFF;
      --error: #FFB4AB; --on-error: #690005;
      --error-container: #93000A; --on-error-container: #FFDAD6;
      --bg: #111318; --on-bg: #E2E2E9;
      --surface-variant: #43474E; --on-surface-variant: #C3C7D0;
      --outline: #8D9199; --outline-variant: #43474E;
      --surf-lowest: #0C0E13; --surf-low: #191C20; --surf: #1D2024; --surf-high: #282A2F; --surf-highest: #33353A;
      --success: #75B798;
      --warning-container: #5B4300; --on-warning-container: #FFDEA6;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--on-bg);
      line-height: 1.4;
      padding: 10px 14px 105px 14px;
      max-width: 860px;
      margin: 0 auto;
      -webkit-font-smoothing: antialiased;
    }

    /* Top App Bar */
    .top-bar {
      position: sticky; top: 0; z-index: 40;
      background: var(--bg);
      padding: 6px 0 10px 0;
      display: flex; flex-direction: column; gap: 10px;
    }
    .bar-row { display: flex; justify-content: space-between; align-items: center; }
    .title-group { display: flex; align-items: center; gap: 8px; }
    .app-title { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em; }
    .badge-v3 {
      font-size: 0.68rem; font-weight: 800;
      background: var(--primary-container); color: var(--on-primary-container);
      padding: 2px 8px; border-radius: var(--r-full);
    }
    .sync-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--success);
      display: inline-block; transition: transform 0.15s, background 0.15s;
    }
    .sync-dot.syncing { background: var(--primary); transform: scale(1.4); }
    .sync-dot.err { background: var(--error); }

    .top-actions { display: flex; gap: 6px; }
    .btn-icon {
      width: 38px; height: 38px; border-radius: var(--r-full); border: none;
      background: var(--surf); color: var(--on-bg);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.05rem;
    }
    .btn-icon:active { transform: scale(0.92); background: var(--surf-highest); }

    /* Tonal Traffic Overview */
    .traffic-card {
      background: var(--surf-low); border-radius: var(--r-lg);
      padding: 10px 14px; border: 1px solid var(--outline-variant);
      display: flex; justify-content: space-between; align-items: center;
    }
    .stat-box { display: flex; align-items: center; gap: 8px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; }
    .dot.rx { background: var(--primary); }
    .dot.tx { background: var(--success); }
    .stat-lbl { font-size: 0.65rem; font-weight: 700; color: var(--on-surface-variant); text-transform: uppercase; }
    .stat-val { font-size: 0.92rem; font-weight: 800; font-family: var(--mono); }
    .stat-val.rx { color: var(--primary); }
    .stat-val.tx { color: var(--success); }

    /* Search & Filter Chips */
    .search-box {
      background: var(--surf-high); border-radius: var(--r-full); height: 44px;
      display: flex; align-items: center; padding: 0 14px; margin-bottom: 10px;
    }
    .search-box input {
      border: none; background: transparent; outline: none; width: 100%;
      margin-left: 8px; font-size: 0.9rem; color: var(--on-bg);
    }
    .chips-row {
      display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 12px;
    }
    .chips-row::-webkit-scrollbar { display: none; }
    .chip {
      height: 32px; padding: 0 12px; border-radius: var(--r-sm);
      display: inline-flex; align-items: center; font-size: 0.78rem; font-weight: 600;
      cursor: pointer; white-space: nowrap; border: 1px solid var(--outline-variant);
      background: var(--bg); color: var(--on-surface-variant); user-select: none;
    }
    .chip.active {
      background: var(--secondary-container); color: var(--on-secondary-container);
      border-color: transparent; font-weight: 700;
    }

    /* Device Grid - Hardware Accelerated Layout Containment */
    .grid {
      display: grid; grid-template-columns: 1fr; gap: 10px;
    }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }

    .card {
      background: var(--surf-low); border-radius: var(--r-lg); padding: 14px;
      border: 1px solid var(--outline-variant);
      display: flex; flex-direction: column; gap: 10px;
      contain: content;
    }
    .card.offline { opacity: 0.55; background: var(--surf-lowest); }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .profile { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .icon-btn {
      width: 44px; height: 44px; border-radius: var(--r-md);
      background: var(--primary-container); color: var(--on-primary-container);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; border: none; cursor: pointer; flex-shrink: 0; position: relative;
    }
    .icon-btn:active { transform: scale(0.92); }
    .icon-badge {
      position: absolute; bottom: -2px; right: -2px; font-size: 0.55rem;
      background: var(--surf-highest); border-radius: 50%; width: 15px; height: 15px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--outline-variant);
    }

    .names { display: flex; flex-direction: column; min-width: 0; cursor: pointer; }
    .name-main {
      font-size: 0.96rem; font-weight: 700; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px;
    }
    .name-sub {
      font-size: 0.72rem; color: var(--on-surface-variant);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* MD3 Switch */
    .switch-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .switch { position: relative; display: inline-block; width: 46px; height: 28px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .track {
      position: absolute; inset: 0; background: var(--surf-highest);
      border: 2px solid var(--outline); border-radius: var(--r-full); cursor: pointer;
    }
    .track::before {
      content: ""; position: absolute; height: 14px; width: 14px; left: 5px; bottom: 5px;
      background: var(--outline); border-radius: 50%; transition: transform 0.15s var(--ease);
    }
    .switch input:checked + .track { background: var(--error); border-color: var(--error); }
    .switch input:checked + .track::before {
      transform: translateX(18px); width: 20px; height: 20px; bottom: 2px; left: 3px;
      background: var(--on-error);
    }

    /* Badges & RSSI */
    .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
    .tag {
      font-size: 0.62rem; font-weight: 700; padding: 1px 6px;
      border-radius: var(--r-xs); text-transform: uppercase;
    }
    .t-rand { background: var(--tertiary-container); color: var(--on-tertiary-container); }
    .t-band { background: var(--surf-highest); color: var(--on-surface-variant); }
    .t-blk { background: var(--error-container); color: var(--on-error-container); }
    .t-new { background: var(--error); color: var(--on-error); }
    .t-qos { background: var(--warning-container); color: var(--on-warning-container); }

    .rssi { display: inline-flex; align-items: flex-end; gap: 2px; height: 11px; margin-left: 4px; }
    .rssi i { width: 3px; background: var(--outline-variant); border-radius: 1px; font-style: normal; }
    .rssi i:nth-child(1) { height: 25%; } .rssi i:nth-child(2) { height: 50%; }
    .rssi i:nth-child(3) { height: 75%; } .rssi i:nth-child(4) { height: 100%; }
    .rssi[data-l="1"] i:nth-child(1) { background: var(--error); }
    .rssi[data-l="2"] i:nth-child(-n+2) { background: #FF9800; }
    .rssi[data-l="3"] i:nth-child(-n+3), .rssi[data-l="4"] i { background: var(--success); }

    /* Matrix */
    .matrix {
      background: var(--surf); border-radius: var(--r-md); padding: 7px 10px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 0.72rem;
    }
    .m-col { display: flex; flex-direction: column; cursor: pointer; }
    .m-col:active { opacity: 0.6; }
    .m-k { font-size: 0.6rem; font-weight: 700; color: var(--on-surface-variant); }
    .m-v { font-family: var(--mono); font-weight: 700; overflow: hidden; text-overflow: ellipsis; }

    /* Bottom Row */
    .card-bot { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
    .spd { display: flex; gap: 8px; font-family: var(--mono); font-size: 0.74rem; font-weight: 800; }
    .spd-d { color: var(--primary); } .spd-u { color: var(--success); }
    .btns { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }
    .btn-sm {
      border: none; background: var(--surf-high); color: var(--on-bg);
      padding: 5px 8px; border-radius: var(--r-sm); font-size: 0.7rem; font-weight: 700; cursor: pointer;
    }
    .btn-sm:active { background: var(--surf-highest); }
    .btn-sm.tonal { background: var(--secondary-container); color: var(--on-secondary-container); }
    .btn-sm.danger { background: var(--error-container); color: var(--on-error-container); }

    /* Static Placeholder (No infinite animation) */
    .skeleton {
      height: 152px; border-radius: var(--r-lg); background: var(--surf-low);
      border: 1px solid var(--outline-variant); opacity: 0.5;
    }

    /* FAB & Bottom Nav */
    .fab {
      position: fixed; right: 16px; bottom: 80px; height: 52px; padding: 0 18px;
      border-radius: var(--r-lg); background: var(--primary-container); color: var(--on-primary-container);
      border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.18);
      display: flex; align-items: center; gap: 8px; font-size: 0.86rem; font-weight: 800;
      cursor: pointer; z-index: 45;
    }
    .fab:active { transform: scale(0.94); }

    .nav-bar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 64px;
      background: var(--surf); border-top: 1px solid var(--outline-variant);
      display: flex; justify-content: space-around; align-items: center;
      z-index: 50; max-width: 860px; margin: 0 auto;
    }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      cursor: pointer; background: transparent; border: none; color: var(--on-surface-variant);
    }
    .nav-pill {
      width: 54px; height: 28px; border-radius: var(--r-full);
      display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
    }
    .nav-lbl { font-size: 0.7rem; font-weight: 700; }
    .nav-btn.active .nav-pill { background: var(--secondary-container); color: var(--on-secondary-container); }
    .nav-btn.active .nav-lbl { color: var(--on-bg); font-weight: 800; }

    /* Dialog & Snackbar */
    .scrim {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100;
    }
    .scrim.hidden { display: none; }
    .dialog {
      background: var(--surf-high); border-radius: var(--r-xl); padding: 20px;
      width: 100%; max-width: 420px; border: 1px solid var(--outline-variant);
    }
    .dlg-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 6px; }
    .dlg-desc { font-size: 0.84rem; color: var(--on-surface-variant); margin-bottom: 14px; }
    .input-m3 {
      width: 100%; padding: 10px 12px; border-radius: var(--r-xs);
      border: 1px solid var(--outline); background: var(--bg); color: var(--on-bg);
      font-size: 0.92rem; outline: none; margin-bottom: 10px;
    }
    .preset-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .icon-grid {
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px;
      max-height: 200px; overflow-y: auto; margin-bottom: 10px;
    }
    .icon-opt {
      height: 42px; border-radius: var(--r-md); border: 1px solid var(--outline-variant);
      background: var(--bg); font-size: 1.3rem; cursor: pointer;
    }
    .icon-opt.sel { background: var(--primary-container); border-color: var(--primary); }

    #toast-box {
      position: fixed; bottom: 76px; left: 16px; right: 16px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      z-index: 120; pointer-events: none;
    }
    .toast {
      padding: 8px 16px; border-radius: var(--r-xs); font-size: 0.82rem; font-weight: 700;
      background: var(--on-bg); color: var(--bg); box-shadow: 0 3px 8px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="bar-row">
      <div class="title-group">
        <h1 class="app-title">Thiết bị mạng</h1>
        <span class="badge-v3">v3.2</span>
        <span class="sync-dot" id="sync-dot" title="Trạng thái kết nối Router"></span>
      </div>
      <div class="top-actions">
        <button class="btn-icon" id="btn-backup" title="Sao lưu / Khôi phục">💾</button>
        <button class="btn-icon" id="btn-theme" title="Đổi Sáng/Tối">🌓</button>
        <button class="btn-icon" id="btn-refresh" title="Làm mới ngay">↻</button>
      </div>
    </div>

    <div class="traffic-card">
      <div class="stat-box">
        <div class="dot rx"></div>
        <div>
          <div class="stat-lbl">Tải xuống</div>
          <div class="stat-val rx" id="tot-rx">0.0 KB/s</div>
        </div>
      </div>
      <div class="stat-box">
        <div class="dot tx"></div>
        <div>
          <div class="stat-lbl">Tải lên</div>
          <div class="stat-val tx" id="tot-tx">0.0 KB/s</div>
        </div>
      </div>
      <div class="stat-box" style="text-align:right">
        <div>
          <div class="stat-lbl">Online</div>
          <div class="stat-val" id="tot-cnt">0 / 0</div>
        </div>
      </div>
    </div>
  </header>

  <section>
    <div class="search-box">
      <span>🔍</span>
      <input type="search" id="search" placeholder="Tìm nhanh tên, IP, MAC, hãng..." autocomplete="off">
    </div>
    <div class="chips-row" id="chips">
      <div class="chip active" data-f="all">Tất cả</div>
      <div class="chip" data-f="5g">🚀 5GHz</div>
      <div class="chip" data-f="2g">📶 2.4GHz</div>
      <div class="chip" data-f="lan">🔌 LAN</div>
      <div class="chip" data-f="blocked">🚫 Bị chặn</div>
      <div class="chip" data-f="qos">⏱️ Giới hạn QoS</div>
      <div class="chip" data-f="speed">⚡ Tốc độ cao</div>
      <div class="chip" data-f="weak">📉 Sóng yếu</div>
    </div>
  </section>

  <main>
    <div id="list" class="grid">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
    <div id="empty" style="display:none; text-align:center; padding:40px 16px; color:var(--on-surface-variant); font-size:0.88rem;">
      Không có thiết bị nào phù hợp.
    </div>
  </main>

  <button class="fab" id="fab-add"><span>➕</span><span>Chặn MAC</span></button>

  <nav class="nav-bar">
    <button class="nav-btn active" id="tab-clients">
      <div class="nav-pill">📱</div>
      <span class="nav-lbl">Kết nối (<span id="cnt-cli">0</span>)</span>
    </button>
    <button class="nav-btn" id="tab-blacklist">
      <div class="nav-pill">🚫</div>
      <span class="nav-lbl">Blacklist (<span id="cnt-blk">0</span>)</span>
    </button>
  </nav>

  <div class="scrim hidden" id="dlg-scrim">
    <div class="dialog">
      <h3 class="dlg-title" id="dlg-title"></h3>
      <p class="dlg-desc" id="dlg-desc"></p>
      <div id="dlg-body" style="display:none"></div>
      <div class="dlg-actions">
        <button class="btn-sm" id="dlg-cancel">Hủy</button>
        <button class="btn-sm danger" id="dlg-ok">Xác nhận</button>
      </div>
    </div>
  </div>

  <div id="toast-box"></div>

  <script>
    /**
     * CR6608 Device Manager v3.2
     * Fixes: Fresh card data closures, DOM sorting, accurate "MỚI" tag, private MAC brand handling, 4s timeout & 5s->10s->30s backoff.
     */
    const DEMO_MODE = true;
    const API = '/cgi-bin/devmgr';
    const CACHE_KEY = 'cr6608_v3_cache';

    const ICONS = ['📱','💻','🖥️','📺','📟','🎮','💡','📷','🤖','🔊','⌚','🔌','🖨️','📡','🚗','🔒','❄️','🧹','📻','🚪','🛎️','🌐','📦','🏷️'];

    const OUI_MAP = new Map([
      ['F0:99:BF','Apple iPhone'],['AC:BC:32','Apple'],['F4:F5:DB','Apple'],['DC:A9:04','Apple iPad'],
      ['B4:FB:E4','Xiaomi'],['7C:49:EB','Xiaomi'],['64:90:C1','Xiaomi'],['28:6C:07','Xiaomi Router'],
      ['50:EC:50','Samsung Galaxy'],['BC:24:11','Samsung TV'],['34:C9:F0','Samsung'],
      ['84:F3:EB','Espressif IoT'],['EC:FA:BC','Espressif'],['A4:CF:12','Espressif ESP'],
      ['D8:3A:DD','Raspberry Pi'],['B8:27:EB','Raspberry Pi'],['E4:5F:01','Raspberry Pi'],
      ['00:1A:7D','PlayStation'],['FC:0F:E6','Sony'],['70:66:55','TP-Link'],
      ['38:F8:89','Huawei'],['70:54:F5','Huawei']
    ]);

    const domRegistry = new Map();

    const state = {
      devices: [],
      tab: 'clients',
      filter: 'all',
      query: '',
      writing: false,
      timer: null,
      delay: 5000,
      errors: 0,
      icons: JSON.parse(localStorage.getItem('cr6608_custom_icons') || '{}'),
      known: new Set(JSON.parse(localStorage.getItem('cr6608_known_macs') || '[]')),
      sessionNew: new Set()
    };

    const $ = id => document.getElementById(id);
    const vibrate = () => navigator.vibrate && navigator.vibrate(20);

    function toast(msg) {
      const box = $('toast-box');
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => el.remove(), 2200);
    }

    function copyText(txt, lbl) {
      vibrate();
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(txt).then(() => toast(`Đã chép ${lbl}: ${txt}`));
      } else {
        const i = document.createElement('input');
        i.value = txt; document.body.appendChild(i); i.select();
        document.execCommand('copy'); i.remove();
        toast(`Đã chép ${lbl}: ${txt}`);
      }
    }

    function fmtSpeed(b) {
      if (!b || b <= 0) return '0 B/s';
      if (b < 1024) return b + ' B/s';
      if (b < 1048576) return (b / 1024).toFixed(1) + ' KB/s';
      return (b / 1048576).toFixed(2) + ' MB/s';
    }

    function fmtQos(kbps) {
      if (!kbps || kbps <= 0) return '';
      if (kbps >= 1024) return (kbps / 1024).toFixed(1).replace(/\.0$/, '') + ' MB/s';
      return kbps + ' KB/s';
    }

    function resolveProfile(d) {
      const mac = (d.mac || '').toUpperCase();
      const firstByte = parseInt(mac.slice(0, 2), 16);
      const isRand = !isNaN(firstByte) && Boolean(firstByte & 0x02);
      const last4 = mac.replace(/[:-]/g, '').slice(-4);

      // Không đoán hãng qua OUI nếu là MAC ngẫu nhiên (bit thứ 2 byte đầu = 1)
      let brand = isRand ? '' : (d.vendor || OUI_MAP.get(mac.slice(0, 8)) || '');

      let name = (d.name || '').trim();
      if (!name) {
        let host = (d.hostname || '').trim();
        if (host === '*' || host === '?' || /^android-[0-9a-f]{8,}$/i.test(host)) host = '';
        if (host) {
          name = host;
          if (!brand && !isRand) {
            if (/iphone/i.test(host)) brand = 'Apple iPhone';
            else if (/ipad/i.test(host)) brand = 'Apple iPad';
            else if (/galaxy/i.test(host)) brand = 'Samsung Galaxy';
          }
        } else if (brand) {
          name = `${brand} · ${last4}`;
        } else {
          name = isRand ? `Thiết bị riêng tư · ${last4}` : `Thiết bị ${last4 || 'Mạng'}`;
        }
      }

      let icon = state.icons[mac];
      if (!icon) {
        if (d.band === 'LAN') icon = '🖥️';
        else if (/tv|tivi/i.test(name + brand)) icon = '📺';
        else if (/iot|esp|vacuum|cam|light|plug/i.test(name + brand)) icon = '💡';
        else if (/ipad|tab/i.test(name)) icon = '📟';
        else if (/macbook|laptop|pc|desktop/i.test(name)) icon = '💻';
        else icon = '📱';
      }

      return { name, brand: brand || (isRand ? 'MAC riêng tư' : 'Chuẩn mạng'), icon, isRand };
    }

    function syncCard(container, d) {
      const mac = d.mac;
      const prof = resolveProfile(d);
      const offline = !d.online;
      const isNew = state.sessionNew.has(mac);
      let rssiLvl = 0;
      if (d.band !== 'LAN' && d.signal) {
        rssiLvl = d.signal >= -55 ? 4 : d.signal >= -67 ? 3 : d.signal >= -78 ? 2 : 1;
      }

      let ref = domRegistry.get(mac);
      if (!ref) {
        const el = document.createElement('article');
        el.className = 'card';
        el.dataset.mac = mac;
        el.innerHTML = `
          <div class="card-top">
            <div class="profile">
              <button class="icon-btn" title="Đổi icon"><span class="v-ico"></span><span class="icon-badge">✎</span></button>
              <div class="names" title="Đổi tên">
                <div class="name-main"><span class="v-name"></span><span style="font-size:0.7rem;opacity:0.45">✎</span></div>
                <div class="name-sub v-sub"></div>
                <div class="tags v-tags"></div>
              </div>
            </div>
            <div class="switch-wrap">
              <label class="switch"><input type="checkbox" class="v-chk"><span class="track"></span></label>
              <span style="font-size:0.58rem;color:var(--on-surface-variant);font-weight:800">CHẶN</span>
            </div>
          </div>
          <div class="matrix">
            <div class="m-col c-ip"><span class="m-k">IP / CỔNG 📋</span><span class="m-v v-ip"></span></div>
            <div class="m-col c-mac"><span class="m-k">MAC ADDR 📋</span><span class="m-v v-mac"></span></div>
          </div>
          <div class="card-bot">
            <div class="spd"><span class="spd-d">↓ <span class="v-rx"></span></span><span class="spd-u">↑ <span class="v-tx"></span></span></div>
            <div class="btns">
              <button class="btn-sm tonal b-qos" title="Giới hạn tốc độ">QoS</button>
              <button class="btn-sm b-static" style="display:none" title="Cố định IP DHCP">Gán IP</button>
              <button class="btn-sm b-wol" title="Đánh thức LAN">WOL</button>
              <button class="btn-sm b-kick" style="display:none">Kick</button>
              <button class="btn-sm danger b-bl">Blacklist</button>
            </div>
          </div>
        `;

        ref = {
          el,
          data: d,
          ico: el.querySelector('.v-ico'),
          name: el.querySelector('.v-name'),
          sub: el.querySelector('.v-sub'),
          tags: el.querySelector('.v-tags'),
          chk: el.querySelector('.v-chk'),
          ip: el.querySelector('.v-ip'),
          mac: el.querySelector('.v-mac'),
          rx: el.querySelector('.v-rx'),
          tx: el.querySelector('.v-tx'),
          qos: el.querySelector('.b-qos'),
          stat: el.querySelector('.b-static'),
          kick: el.querySelector('.b-kick'),
          bl: el.querySelector('.b-bl'),
          cache: {}
        };

        // Luôn đọc từ ref.data & ref.cache mới nhất thay vì closure cũ
        el.querySelector('.icon-btn').onclick = () => {
          vibrate();
          openIconPicker(ref.data.mac, ref.cache.ico);
        };
        el.querySelector('.names').onclick = () => {
          vibrate();
          openRename(ref.data.mac, ref.data.name || '', ref.cache.name);
        };
        el.querySelector('.c-ip').onclick = () => {
          if (ref.data.ip) copyText(ref.data.ip, 'IP');
        };
        el.querySelector('.c-mac').onclick = () => copyText(ref.data.mac, 'MAC');

        ref.chk.onchange = e => {
          vibrate();
          const curMac = ref.data.mac;
          postAction({ action: e.target.checked ? 'block' : 'unblock', mac: curMac })
            .then(ok => { if (!ok) e.target.checked = !e.target.checked; else fetchList(); });
        };

        ref.qos.onclick = () => {
          vibrate();
          openQosModal(ref.data.mac, ref.cache.name, Number(ref.data.qos_rate || 0));
        };

        ref.stat.onclick = () => {
          const curIp = ref.data.ip;
          const curMac = ref.data.mac;
          if (!curIp) return;
          openConfirm('Cố định IP (Static DHCP)', `Khóa cứng IP ${curIp} cho "${ref.cache.name}"?`, () =>
            postAction({ action: 'static_lease', mac: curMac, ip: curIp })
          );
        };

        el.querySelector('.b-wol').onclick = () => {
          const curMac = ref.data.mac;
          openConfirm('Đánh thức LAN (WOL)', `Gửi Magic Packet tới [${curMac}]?`, () =>
            postAction({ action: 'wol', mac: curMac })
          );
        };

        ref.kick.onclick = () => {
          const curMac = ref.data.mac;
          openConfirm('Kick Wi-Fi', `Ngắt kết nối ngay của "${ref.cache.name}"?`, () =>
            postAction({ action: 'kick', mac: curMac }).then(ok => ok && fetchList())
          );
        };

        ref.bl.onclick = () => {
          const curMac = ref.data.mac;
          const isBl = Boolean(ref.data.blacklisted);
          openConfirm(isBl ? 'Bỏ Blacklist' : 'Thêm Blacklist', `${isBl ? 'Cho phép' : 'Cấm vĩnh viễn'} "${ref.cache.name}"?`, () =>
            postAction({ action: isBl ? 'blacklist_remove' : 'blacklist_add', mac: curMac }).then(ok => ok && fetchList())
          );
        };

        domRegistry.set(mac, ref);
        container.appendChild(el);
      }

      // Cập nhật tham chiếu dữ liệu mới nhất mỗi chu kỳ
      ref.data = d;
      const c = ref.cache;
      const qosRate = Number(d.qos_rate || 0);

      if (c.offline !== offline) { ref.el.classList.toggle('offline', offline); c.offline = offline; }
      if (c.ico !== prof.icon) { ref.ico.textContent = prof.icon; c.ico = prof.icon; }
      if (c.name !== prof.name) { ref.name.textContent = prof.name; c.name = prof.name; }

      const subKey = `${prof.brand}|${d.online}|${rssiLvl}|${d.signal || ''}`;
      if (c.subKey !== subKey) {
        const bars = rssiLvl > 0 ? `<span class="rssi" data-l="${rssiLvl}" title="${d.signal} dBm"><i></i><i></i><i></i><i></i></span>` : '';
        ref.sub.innerHTML = `${prof.brand} · ${d.online ? 'Online' : 'Offline'}${bars}`;
        c.subKey = subKey;
      }

      const qosTxt = fmtQos(qosRate);
      const tagKey = `${isNew}|${prof.isRand}|${d.band}|${d.blocked}|${qosTxt}`;
      if (c.tagKey !== tagKey) {
        let h = '';
        if (isNew) h += '<span class="tag t-new">MỚI</span>';
        if (prof.isRand) h += '<span class="tag t-rand">MAC riêng tư</span>';
        if (d.band) h += `<span class="tag t-band">${d.band}</span>`;
        if (qosTxt) h += `<span class="tag t-qos">Max ${qosTxt}</span>`;
        if (d.blocked) h += '<span class="tag t-blk">Bị chặn</span>';
        ref.tags.innerHTML = h;
        c.tagKey = tagKey;
      }

      const blk = Boolean(d.blocked);
      if (c.blk !== blk) { ref.chk.checked = blk; c.blk = blk; }

      const ipStr = `${d.ip || 'Chưa cấp IP'} (${d.iface || 'eth'})`;
      if (c.ipStr !== ipStr) { ref.ip.textContent = ipStr; c.ipStr = ipStr; }
      if (c.mac !== mac) { ref.mac.textContent = mac; c.mac = mac; }

      const rxStr = fmtSpeed(d.rx);
      if (c.rxStr !== rxStr) { ref.rx.textContent = rxStr; c.rxStr = rxStr; }
      const txStr = fmtSpeed(d.tx);
      if (c.txStr !== txStr) { ref.tx.textContent = txStr; c.txStr = txStr; }

      const canStatic = Boolean(d.ip && !d.blacklisted);
      if (c.canStatic !== canStatic) { ref.stat.style.display = canStatic ? 'inline-block' : 'none'; c.canStatic = canStatic; }

      const canKick = d.online && d.band !== 'LAN' && !d.blacklisted;
      if (c.canKick !== canKick) { ref.kick.style.display = canKick ? 'inline-block' : 'none'; c.canKick = canKick; }

      const isBl = Boolean(d.blacklisted);
      if (c.bl !== isBl) { ref.bl.textContent = isBl ? 'Bỏ Blacklist' : 'Blacklist'; c.bl = isBl; }
    }

    function render() {
      const container = $('list');
      container.querySelectorAll('.skeleton').forEach(s => s.remove());

      let list = state.devices.filter(d => state.tab === 'blacklist' ? d.blacklisted : (!d.blacklisted && (d.online || d.blocked)));

      if (state.filter === '5g') list = list.filter(d => (d.band || '').includes('5G'));
      else if (state.filter === '2g') list = list.filter(d => (d.band || '').includes('2'));
      else if (state.filter === 'lan') list = list.filter(d => d.band === 'LAN');
      else if (state.filter === 'blocked') list = list.filter(d => d.blocked);
      else if (state.filter === 'qos') list = list.filter(d => Number(d.qos_rate || 0) > 0);
      else if (state.filter === 'weak') list = [...list]
        .filter(d => d.online && d.band !== 'LAN' && d.signal && d.signal < -72)
        .sort((a, b) => (a.signal || 0) - (b.signal || 0));
      else if (state.filter === 'speed') list = [...list]
        .sort((a, b) => ((b.rx || 0) + (b.tx || 0)) - ((a.rx || 0) + (a.tx || 0)));

      if (state.query) {
        const q = state.query;
        list = list.filter(d => {
          const p = resolveProfile(d);
          return d.mac.toLowerCase().includes(q) || (d.ip && d.ip.includes(q)) || p.name.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q);
        });
      }

      const activeSet = new Set(list.map(d => d.mac));
      for (const [mac, ref] of domRegistry.entries()) {
        if (!activeSet.has(mac)) {
          ref.el.remove();
          domRegistry.delete(mac);
        }
      }

      // Đồng bộ nội dung từng card và bảo toàn đúng thứ tự DOM khi sắp xếp
      list.forEach((d, idx) => {
        syncCard(container, d);
        const ref = domRegistry.get(d.mac);
        if (ref && container.children[idx] !== ref.el) {
          container.insertBefore(ref.el, container.children[idx] || null);
        }
      });

      $('empty').style.display = list.length === 0 ? 'block' : 'none';

      const clients = state.devices.filter(d => !d.blacklisted && (d.online || d.blocked));
      let onlineCnt = 0, rxSum = 0, txSum = 0;
      for (let i = 0; i < clients.length; i++) {
        if (clients[i].online) {
          onlineCnt++;
          rxSum += (clients[i].rx || 0);
          txSum += (clients[i].tx || 0);
        }
      }
      $('cnt-cli').textContent = clients.length;
      $('cnt-blk').textContent = state.devices.filter(d => d.blacklisted).length;
      $('tot-cnt').textContent = `${onlineCnt} / ${clients.length}`;
      $('tot-rx').textContent = fmtSpeed(rxSum);
      $('tot-tx').textContent = fmtSpeed(txSum);
    }

    async function postAction(payload) {
      if (state.writing) { toast('Đang xử lý...'); return false; }
      state.writing = true;
      const ctrl = new AbortController();
      const tid = setTimeout(() => ctrl.abort(), 4000);
      try {
        if (DEMO_MODE) {
          await new Promise(r => setTimeout(r, 250));
          const dev = state.devices.find(x => x.mac === payload.mac);
          if (dev) {
            if (payload.action === 'block') dev.blocked = true;
            if (payload.action === 'unblock') dev.blocked = false;
            if (payload.action === 'rename') dev.name = payload.name;
            if (payload.action === 'qos_limit') dev.qos_rate = payload.rate;
            if (payload.action === 'blacklist_add') dev.blacklisted = true;
            if (payload.action === 'blacklist_remove') dev.blacklisted = false;
            if (payload.action === 'kick') dev.online = false;
          } else if (payload.action === 'blacklist_add') {
            state.devices.push({ mac: payload.mac, ip: '', hostname: '', name: '', vendor: '', iface: 'wlan0', band: '5G', signal: 0, rx: 0, tx: 0, qos_rate: 0, online: false, blocked: false, blacklisted: true });
          }
          clearTimeout(tid); vibrate(); toast('Demo: Thành công'); render(); return true;
        }
        const res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          signal: ctrl.signal
        });
        clearTimeout(tid);
        const data = await res.json();
        if (data.ok) { vibrate(); toast('Thành công'); return true; }
        toast(data.error || 'Router từ chối lệnh');
        return false;
      } catch (e) {
        clearTimeout(tid);
        toast(e.name === 'AbortError' ? 'Quá thời gian (4s)' : 'Lỗi kết nối');
        return false;
      } finally {
        state.writing = false;
      }
    }

    function markKnownDevices(devices) {
      let updated = false;
      devices.forEach(d => {
        if (d.mac && !state.known.has(d.mac)) {
          // Đánh dấu MỚI trong phiên hiện tại trước khi ghi vào danh sách đã biết
          state.sessionNew.add(d.mac);
          state.known.add(d.mac);
          updated = true;
        }
      });
      if (updated) {
        localStorage.setItem('cr6608_known_macs', JSON.stringify([...state.known]));
      }
    }

    async function fetchList() {
      if (state.timer) { clearTimeout(state.timer); state.timer = null; }
      const dot = $('sync-dot');
      dot.className = 'sync-dot syncing';

      if (DEMO_MODE) {
        if (!state.devices.length) {
          state.devices = [
            { mac: 'F0:99:BF:11:22:33', ip: '192.168.2.101', hostname: 'iPhone-Pro', name: '', vendor: 'Apple', iface: 'wlan1', band: '5G', signal: -48, rx: 1450000, tx: 230000, qos_rate: 0, online: true, blocked: false, blacklisted: false },
            { mac: 'B4:FB:E4:44:55:66', ip: '192.168.2.105', hostname: 'Mi-TV-4K', name: 'TV Phòng Khách', vendor: 'Xiaomi', iface: 'wlan1', band: '5G', signal: -64, rx: 4200000, tx: 85000, qos_rate: 5120, online: true, blocked: false, blacklisted: false },
            { mac: 'D8:3A:DD:77:88:99', ip: '192.168.2.110', hostname: 'raspberrypi', name: '', vendor: 'Raspberry Pi', iface: 'eth0.1', band: 'LAN', signal: 0, rx: 52000, tx: 18000, qos_rate: 0, online: true, blocked: false, blacklisted: false },
            { mac: '3E:A1:90:AA:BB:CC', ip: '192.168.2.120', hostname: '*', name: '', vendor: 'FakeVendor', iface: 'wlan0', band: '2.4G', signal: -79, rx: 0, tx: 0, qos_rate: 0, online: true, blocked: true, blacklisted: false }
          ];
          markKnownDevices(state.devices);
        }
        dot.className = 'sync-dot';
        render();
        state.timer = setTimeout(fetchList, 5000);
        return;
      }

      const ctrl = new AbortController();
      const tid = setTimeout(() => ctrl.abort(), 4000);

      try {
        const res = await fetch(`${API}?action=list`, { signal: ctrl.signal, cache: 'no-store' });
        clearTimeout(tid);
        if (!res.ok) throw new Error();
        const json = await res.json();
        state.devices = json.devices || [];

        localStorage.setItem(CACHE_KEY, JSON.stringify(state.devices));
        markKnownDevices(state.devices);

        state.errors = 0;
        state.delay = 5000;
        dot.className = 'sync-dot';
        render();
      } catch (e) {
        clearTimeout(tid);
        state.errors++;
        // Backoff: 5s -> 10s -> 30s
        state.delay = state.errors === 1 ? 10000 : 30000;
        dot.className = 'sync-dot err';
      } finally {
        if (document.visibilityState === 'visible') {
          state.timer = setTimeout(fetchList, state.delay);
        }
      }
    }

    // Dialog Handlers
    let dlgCb = null;
    const closeDlg = () => { $('dlg-scrim').classList.add('hidden'); $('dlg-body').innerHTML = ''; $('dlg-body').style.display = 'none'; dlgCb = null; };
    $('dlg-cancel').onclick = closeDlg;
    $('dlg-ok').onclick = () => { if (dlgCb) dlgCb(); closeDlg(); };

    function openConfirm(title, desc, cb) {
      $('dlg-title').textContent = title;
      $('dlg-desc').textContent = desc;
      $('dlg-body').style.display = 'none';
      dlgCb = cb;
      $('dlg-scrim').classList.remove('hidden');
    }

    function openQosModal(mac, name, curRate) {
      $('dlg-title').textContent = 'Giới hạn tốc độ (QoS)';
      $('dlg-desc').textContent = `Đặt hạn mức (KB/s) cho "${name}". Nhập 0 để gỡ, tối thiểu 16 KB/s:`;
      const body = $('dlg-body');
      body.style.display = 'block';
      body.innerHTML = '';

      const presets = [
        { l: 'Gỡ (0)', v: 0 },
        { l: '512 KB/s', v: 512 },
        { l: '1 MB/s', v: 1024 },
        { l: '3 MB/s', v: 3072 },
        { l: '5 MB/s', v: 5120 }
      ];
      const pRow = document.createElement('div');
      pRow.className = 'preset-row';
      const inp = document.createElement('input');
      inp.className = 'input-m3'; inp.type = 'number'; inp.min = '0'; inp.step = '16';
      inp.value = curRate || 0;
      inp.placeholder = 'Tốc độ tối đa (KB/s)...';

      presets.forEach(p => {
        const b = document.createElement('button');
        b.className = 'btn-sm tonal';
        b.textContent = p.l;
        b.onclick = () => { inp.value = p.v; };
        pRow.appendChild(b);
      });

      body.appendChild(pRow);
      body.appendChild(inp);

      dlgCb = () => {
        const raw = parseInt(inp.value || '0', 10);
        const rate = raw <= 0 ? 0 : Math.max(16, raw);
        if (rate !== curRate) {
          postAction({ action: 'qos_limit', mac, rate }).then(ok => ok && fetchList());
        }
      };
      $('dlg-scrim').classList.remove('hidden');
    }

    function openIconPicker(mac, cur) {
      $('dlg-title').textContent = 'Đổi biểu tượng';
      $('dlg-desc').textContent = `Chọn icon cho [${mac}]:`;
      const body = $('dlg-body');
      body.style.display = 'block';
      let sel = cur;
      const g = document.createElement('div');
      g.className = 'icon-grid';
      ICONS.forEach(ic => {
        const b = document.createElement('button');
        b.className = `icon-opt ${ic === cur ? 'sel' : ''}`;
        b.textContent = ic;
        b.onclick = () => { g.querySelectorAll('.icon-opt').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); sel = ic; };
        g.appendChild(b);
      });
      body.innerHTML = ''; body.appendChild(g);
      dlgCb = () => { state.icons[mac] = sel; localStorage.setItem('cr6608_custom_icons', JSON.stringify(state.icons)); render(); toast(`Đã đổi icon ${sel}`); };
      $('dlg-scrim').classList.remove('hidden');
    }

    function openRename(mac, savedName, displayName) {
      $('dlg-title').textContent = 'Đổi tên thiết bị';
      $('dlg-desc').textContent = `Lưu tên mới lên Router cho [${mac}]:`;
      const body = $('dlg-body');
      body.style.display = 'block';
      const inp = document.createElement('input');
      inp.className = 'input-m3'; inp.maxLength = 32;
      inp.value = savedName || (displayName.includes('·') ? '' : displayName);
      inp.placeholder = 'Để trống để dùng tên tự động...';
      body.innerHTML = ''; body.appendChild(inp);
      dlgCb = () => {
        const v = inp.value.trim();
        if (v !== savedName) postAction({ action: 'rename', mac, name: v }).then(ok => ok && fetchList());
      };
      $('dlg-scrim').classList.remove('hidden');
      setTimeout(() => inp.focus(), 60);
    }

    function openAddMac() {
      $('dlg-title').textContent = 'Chặn MAC thủ công';
      $('dlg-desc').textContent = 'Nhập địa chỉ MAC cần cấm truy cập Wi-Fi:';
      const body = $('dlg-body');
      body.style.display = 'block';
      const inp = document.createElement('input');
      inp.className = 'input-m3'; inp.maxLength = 17; inp.placeholder = 'AA:BB:CC:DD:EE:FF';
      body.innerHTML = ''; body.appendChild(inp);
      dlgCb = () => {
        const v = inp.value.trim().toUpperCase();
        if (/^([0-9A-F]{2}[:-]){5}([0-9A-F]{2})$/.test(v)) postAction({ action: 'blacklist_add', mac: v }).then(ok => ok && fetchList());
        else toast('MAC không hợp lệ');
      };
      $('dlg-scrim').classList.remove('hidden');
      setTimeout(() => inp.focus(), 60);
    }

    function openBackup() {
      $('dlg-title').textContent = 'Sao lưu & Khôi phục';
      $('dlg-desc').textContent = 'Sao chép hoặc dán mã JSON bên dưới để khôi phục icon:';
      const body = $('dlg-body');
      body.style.display = 'block';
      const ta = document.createElement('textarea');
      ta.className = 'input-m3'; ta.style.height = '80px';
      ta.value = JSON.stringify(state.icons);
      const btn = document.createElement('button');
      btn.className = 'btn-sm'; btn.textContent = '📥 Nạp dữ liệu';
      btn.onclick = () => {
        try {
          state.icons = JSON.parse(ta.value.trim());
          localStorage.setItem('cr6608_custom_icons', JSON.stringify(state.icons));
          render(); toast('Đã khôi phục icon'); closeDlg();
        } catch (e) { toast('Lỗi cú pháp JSON'); }
      };
      body.innerHTML = ''; body.appendChild(ta); body.appendChild(btn);
      dlgCb = null;
      $('dlg-scrim').classList.remove('hidden');
    }

    (function init() {
      const savedTheme = localStorage.getItem('cr6608_m3_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = savedTheme;

      $('btn-theme').onclick = () => {
        vibrate();
        const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        localStorage.setItem('cr6608_m3_theme', next);
      };
      $('btn-refresh').onclick = () => { vibrate(); toast('Đang làm mới...'); fetchList(); };
      $('btn-backup').onclick = () => { vibrate(); openBackup(); };
      $('fab-add').onclick = () => { vibrate(); openAddMac(); };

      let sTimer;
      $('search').oninput = e => {
        clearTimeout(sTimer);
        sTimer = setTimeout(() => { state.query = e.target.value.trim().toLowerCase(); render(); }, 120);
      };

      $('chips').onclick = e => {
        const c = e.target.closest('.chip');
        if (!c) return;
        vibrate();
        $('chips').querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
        c.classList.add('active');
        state.filter = c.dataset.f;
        render();
      };

      $('tab-clients').onclick = () => {
        if (state.tab === 'clients') return;
        vibrate(); state.tab = 'clients';
        $('tab-clients').classList.add('active'); $('tab-blacklist').classList.remove('active');
        render();
      };
      $('tab-blacklist').onclick = () => {
        if (state.tab === 'blacklist') return;
        vibrate(); state.tab = 'blacklist';
        $('tab-blacklist').classList.add('active'); $('tab-clients').classList.remove('active');
        render();
      };

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') fetchList();
        else if (state.timer) { clearTimeout(state.timer); state.timer = null; }
      });

      const cached = localStorage.getItem(CACHE_KEY);
      if (cached) {
        try { state.devices = JSON.parse(cached); render(); } catch (e) {}
      }

      fetchList();
    })();
  </script>
</body>
</html>
